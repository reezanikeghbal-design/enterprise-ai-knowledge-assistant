<text x="322" y="201" fill="#64748b" font-family="Arial" font-size="18">Get grounded answers from your indexed documents</text><rect x="322" y="245" width="1036" height="550" rx="18" fill="#fff" stroke="#dbe5ef"/><rect x="360" y="285" width="680" height="88" rx="16" fill="#eff6ff"/><text x="390" y="322" fill="#1e3a8a" font-family="Arial" font-size="18">What is the document retention policy?</text><rect x="390" y="414" width="900" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="424" y="458" fill="#0f172a" font-family="Arial" font-size="20" font-weight="700">Assistant answer</text><text x="424" y="503" fill="#334155" font-family="Arial" font-size="18">Records are retained according to their classification and</text><text x="424" y="535" fill="#334155" font-family="Arial" font-size="18">the applicable retention schedule. Review the source policy</text><text x="424" y="567" fill="#334155" font-family="Arial" font-size="18">for exceptions and approval requirements.</text><rect x="424" y="594" width="230" height="36" rx="9" fill="#dbeafe"/><text x="442" y="618" fill="#1d4ed8" font-family="Arial" font-size="15">Source: retention-policy.pdf</text><rect x="360" y="704" width="930" height="58" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="390" y="741" fill="#94a3b8" font-family="Arial" font-size="17">Ask a question about your documents…</text><rect x="1195" y="713" width="75" height="40" rx="10" fill="url(#blue)"/><text x="1214" y="739" fill="#fff" font-family="Arial" font-size="16">Send</text></svg>